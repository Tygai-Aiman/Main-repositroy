name: Daily GTA 6 Shorts

on:
  schedule:
    - cron: "17 10 * * *"   # ~5:17am New York time, every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make the videos but don't upload"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: daily-clips

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg, fonts, JS runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core fonts-noto-color-emoji
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - run: pip install -r requirements.txt

      - name: YouTube cookies (helps avoid "confirm you're not a bot")
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Make and schedule today's 5 Shorts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m clipbot.run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save streamer history (so tomorrow uses a different streamer)
        if: success() && !inputs.dry_run
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add clipbot/state/history.json
          git diff --cached --quiet || git commit -m "clipbot: update streamer history"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-${{ github.run_id }}
          path: output/*.mp4
          retention-days: 7
